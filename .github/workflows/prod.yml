name: Production Branch

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to redeploy'
        required: true
        type: string

jobs:
  build-docker-image:
    name: 'Build/push Docker image'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'unevenlabs/relay-vaults'
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: |
            ghcr.io/unevenlabs/relay-vaults
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.tag }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.1.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ steps.release.outputs.tag }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'unevenlabs/relay-vaults'
    needs: [build-docker-image]
    environment: prod
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEVOPSBOT_TOKEN }}
          VERSION: ${{ needs.build-docker-image.outputs.release-tag }}
        run: |
          payload=$(printf '{"event_type":"deploy","client_payload":{"app":"relay-vaults","version":"%s","environment":"stag+prod","actor":"%s"}}' "$VERSION" "${{ github.actor }}")
          gh api repos/unevenlabs/k8s-configs/dispatches --method POST --input - <<< "$payload"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Deploy ✅"
            else
              echo "### Deploy ❌"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **App** | \`relay-vaults\` |"
            echo "| **Version** | \`${{ needs.build-docker-image.outputs.release-tag }}\` |"
            echo "| **Environment** | \`stag+prod\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
